name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src

      - name: Unit + integration + contract + snapshot tests
        run: pytest tests/unit tests/integration tests/contract tests/snapshot -v

      - name: Mapping-table completeness check
        run: |
          python -c "
          from finban_mapper.mapping.rules import load_rules
          rules = load_rules('src/finban_mapper/mapping/seed_rules.yaml')
          groups = set((r.external_system, r.external_type) for r in rules)
          fallbacks = set((r.external_system, r.external_type) for r in rules if r.is_fallback)
          missing = groups - fallbacks
          # bank_transaction is a flat 1:1 mapping with no ambiguous states, so it's exempt
          missing = {g for g in missing if g[1] != 'bank_transaction'}
          assert not missing, f'Missing fallback rule for: {missing}'
          print('Mapping table completeness OK')
          "
