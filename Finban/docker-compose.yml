services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finban
      POSTGRES_PASSWORD: finban
      POSTGRES_DB: finban_mapper
    ports:
      - "5432:5432"
    volumes:
      - finban_pg_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      FINBAN_DATABASE_URL: postgresql+psycopg2://finban:finban@db:5432/finban_mapper
      FINBAN_LEXWARE_OFFICE_API_KEY: ${FINBAN_LEXWARE_OFFICE_API_KEY:-changeme}
    ports:
      - "8000:8000"

volumes:
  finban_pg_data:
