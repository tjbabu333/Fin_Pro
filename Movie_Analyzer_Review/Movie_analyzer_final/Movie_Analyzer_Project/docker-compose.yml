services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moviereviews
      POSTGRES_USER: movieuser
      POSTGRES_PASSWORD: moviepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieuser -d moviereviews"]
      interval: 5s
      timeout: 3s
      retries: 10

  model:
    build: ./model
    environment:
      MODEL_PORT: 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://movieuser:moviepass@database:5432/moviereviews
      MODEL_SERVER_URL: http://model:5000
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      model:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
